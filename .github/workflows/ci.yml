name: Build DiagramKiln

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Release workflow guard tests
        run: python3 -B -m unittest discover -s .github/tests -p "test_*.py"
      - name: Tests, strict Javadoc, formatting and packaged consumer
        run: bash ./mvnw -B -ntp verify
